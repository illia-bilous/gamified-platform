<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | MathMaze</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">MathMaze</div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var myGameInstance = null; // Глобальна змінна для гри

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/MathMaze.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/MathMaze.data",
        frameworkUrl: buildUrl + "/MathMaze.framework.js",
        codeUrl: buildUrl + "/MathMaze.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MathMaze",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // Мобільна адаптація
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        // Десктоп стиль
        if(canvas) {
            canvas.style.width = "960px";
            canvas.style.height = "600px";
        }
      }

      var loadingBar = document.querySelector("#unity-loading-bar");
      if (loadingBar) loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var fullBar = document.querySelector("#unity-progress-bar-full");
          if(fullBar) fullBar.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          
          // === ЗБЕРІГАЄМО ІНСТАНС ===
          myGameInstance = unityInstance;
          
          if (loadingBar) loadingBar.style.display = "none";
          var fullscreenBtn = document.querySelector("#unity-fullscreen-button");
          if(fullscreenBtn) {
              fullscreenBtn.onclick = () => {
                unityInstance.SetFullscreen(1);
              };
          }
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      // === СЛУХАЧ ПОВІДОМЛЕНЬ (BRIDGE) ===
      window.addEventListener('message', function(event) {
          if (myGameInstance == null) {
              console.warn("⏳ Unity ще не завантажився, чекаємо...");
              return;
          }

          console.log("📥 Index.html отримав дані:", event.data);

          if (typeof event.data === 'string' && event.data.includes("question")) {
              // Передаємо дані в Unity
              myGameInstance.SendMessage('MathLevelManager', 'ReceiveConfig', event.data);
          }
      });

    </script>
  </body>
</html>
