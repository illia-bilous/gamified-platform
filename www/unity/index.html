<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | MathMaze</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">MathMaze</div>
      </div>
    </div>

    <script>
      var unityInstance = null;
      var gameInstance = null;
    </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, doc, getDoc, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDM5N2KjctWbKKtY1bP0bde5kaNxqDExbI",
        authDomain: "mathmaze-d57fb.firebaseapp.com",
        projectId: "mathmaze-d57fb",
        storageBucket: "mathmaze-d57fb.firebasestorage.app",
        messagingSenderId: "981708916474",
        appId: "1:981708916474:web:b050824643314771e2eb43",
        measurementId: "G-N9TKW7269V"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('uid');

      if(userId) console.log("✅ Визначено ID учня:", userId);

      // --- UNITY CODE ---
      var canvas = document.querySelector("#unity-canvas");

      // Змінна для збереження гри глобально
      var myGameInstance = null;

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/MathMaze.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/MathMaze.data",
        frameworkUrl: buildUrl + "/MathMaze.framework.js",
        codeUrl: buildUrl + "/MathMaze.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MathMaze",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        })
        .then((instance) => {
          
          // 🔥🔥🔥 ВИПРАВЛЕННЯ: Присвоюємо значення глобальним змінним 🔥🔥🔥
          unityInstance = instance;
          gameInstance = instance;
          window.unityInstance = instance; // Для страховки
          
          console.log("🚀 UNITY АБСОЛЮТНО ГОТОВА! (unityInstance is set globally)");

          // 👇👇👇 ДОДАЙТЕ ЦЕЙ БЛОК 👇👇👇
          window.addEventListener("message", (event) => {
            // Перевіряємо, чи це повідомлення з конфігом
            if (event.data && event.data.type === "SET_UNITY_CONFIG") {
                console.log("📥 [Unity HTML] Отримано конфіг через postMessage, передаємо в гру...");
                
                // instance тут доступний напряму, нам не потрібен window.unityInstance
                instance.SendMessage("GameManager", "SetLevelConfig", event.data.payload);
            }
          });
          // 👆👆👆 КІНЕЦЬ БЛОКУ 👆👆👆

          document.querySelector("#unity-loading-bar").style.display = "none";

          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            instance.SetFullscreen(1);
          };

          if (userId) {
              const userRef = doc(db, "users", userId);
              getDoc(userRef).then((snapshot) => {
                  if (snapshot.exists()) {
                      const data = snapshot.data();
                      if (data.resetTopicCommand) {
                          instance.SendMessage("GameManager", "ResetTopicFromJS", data.resetTopicCommand);
                          updateDoc(userRef, { resetTopicCommand: deleteField() });
                      }
                  }
              }).catch((err) => console.error("Помилка Firebase:", err));
          }

        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
